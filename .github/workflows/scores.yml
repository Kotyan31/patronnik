name: scores

# The game posts each result as a signed comment on the locked issue "patronnik-scores".
# This job checks the signatures, writes scores.json and deletes the handled comments.
# Run it once by hand after adding the LB_PAT secret: it creates the issue and lb.json.
on:
  issue_comment:
    types: [created]
  # a new page version: learn its code fingerprint at once, so its first results are not turned away as "old"
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# runs queue up; each run handles every comment waiting on the issue, so a skipped run loses nothing
concurrency:
  group: scores
  cancel-in-progress: false

jobs:
  scores:
    # any comment wakes it: the script itself only reads the issue named in lb.json, so renaming that issue cannot stop it
    if: github.event_name == 'workflow_dispatch' || !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check new results
        env:
          GH_TOKEN: ${{ github.token }}
          LB_PAT: ${{ secrets.LB_PAT }}
          REPO: ${{ github.repository }}
        run: python3 .github/lb.py process

      - name: Commit
        run: |
          git config user.name "scores-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores.json lb.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "scores: update"
          for i in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Remove handled comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/lb.py cleanup
