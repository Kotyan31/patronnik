name: scores

# A result sent from the game arrives as an issue titled "score: ...".
# This job checks it, writes it into scores.json and closes the issue.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: scores
  cancel-in-progress: false

jobs:
  add:
    if: startsWith(github.event.issue.title, 'score:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update scores.json
        env:
          BODY: ${{ github.event.issue.body }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: python3 .github/scores.py

      - name: Commit
        env:
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "scores-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores.json
          if ! git diff --cached --quiet; then
            git commit -m "score: $LOGIN"
            git pull --rebase
            git push
          fi

      - name: Close the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "$(cat result.txt 2>/dev/null || echo 'Не получилось обработать результат.')"
